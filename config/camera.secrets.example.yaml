# Copy this file to config/<name>.secrets.yaml (matching the camera.name in
# your config/<name>.yaml) and fill in real credentials.
# config/*.secrets.yaml is gitignored -- it must NEVER be committed.
camera:
  username: ""
  password: ""

web:
