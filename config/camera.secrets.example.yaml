# Reference template for one camera's secrets file
# (config/cameras/<name>.secrets.yaml) -- normally created and edited for
# you by the fleet web UI's Add Camera / Settings forms, not copied by
# hand. config/cameras/ is gitignored -- nothing under it must ever be
# committed.
#
# The web UI's own auth token is NOT here -- it's fleet-wide, in
# config/fleet.secrets.yaml, generated automatically. See the root
# README's "Authentication" section.
camera:
  username: ""
  password: ""
